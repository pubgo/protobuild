builds:
  - main: ./main.go
    id: protobuild
    binary: protobuild
    skip: false
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # no ldflags: funk v2 version meta is unexported; it is injected in
    # main.go via go:embed .version/VERSION and runtime/debug vcs stamping
archives:
  - name_template: "{{ .Binary }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    format: binary
report_sizes: true
