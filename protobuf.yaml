checksum: dd2b127e1eadc1a98d7bc5b99ae078c739f2d325
vendor: .proto
base:
  out: ./pkg
  paths: import
  module: github.com/pubgo/protobuild/pkg
root:
  - proto
includes:
  - proto
deps:
  - name: google/protobuf
    url: /usr/local/include/google/protobuf
  - name: retag
    url: github.com/pubgo/protoc-gen-retag
    path: proto/retag
    version: v0.0.5
plugins:
  - name: go
  - name: retag
linter:
  rules:
    enabled_rules:
      - core::0131::http-method
      - core::0131::http-body
      - core::0235::plural-method-name
    disabled_rules:
      - all
  format_type: yaml
